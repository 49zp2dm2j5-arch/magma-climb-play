<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Magma Climb</title>
    <link rel="icon" href="data:," />
    
    <script type="module" crossorigin src="./assets/index-C00E1WdA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cd4aLGi2.css">
  </head>
  <body>
    <canvas id="c" tabindex="0"></canvas>

    <div id="vignette"></div>
    <div id="heat"></div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-gem" viewBox="0 0 24 24"><path d="M12 2 22 9 12 22 2 9Z" /></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5" /><rect x="14" y="4" width="5" height="16" rx="1.5" /></symbol>
        <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></symbol>
        <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Z" /><path d="m16 9 6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></symbol>
        <symbol id="i-speed" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7Z" /></symbol>
        <symbol id="i-jump" viewBox="0 0 24 24"><path d="M12 2 5 10h4v5h6v-5h4Z" /><rect x="7" y="18" width="10" height="3" rx="1.5" /></symbol>
        <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M4 3h5v9a3 3 0 0 0 6 0V3h5v9a8 8 0 0 1-16 0Z" /><rect x="4" y="3" width="5" height="3" fill="#fff6e8" /><rect x="15" y="3" width="5" height="3" fill="#fff6e8" /></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 1 2.5 6.5v11L12 23l9.5-5.5v-11Z" opacity=".35" /><path d="M12 5v14M6 8.5l12 7M18 8.5l-12 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></symbol>
        <symbol id="i-double" viewBox="0 0 24 24"><path d="M12 3 4 11h5l3-3 3 3h5Z" /><path d="M12 11 4 19h5l3-3 3 3h5Z" /></symbol>
        <symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="3" /><path d="m17 10 5-3v10l-5-3Z" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.2A4.8 4.8 0 0 1 12 6.9a4.8 4.8 0 0 1 8.5 2.9C20.5 15.8 12 21 12 21Z" /></symbol>
        <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 4v6h-6l2.3-2.3A5.5 5.5 0 0 0 6.5 12Z" /><path d="M20 12a8 8 0 0 1-13.7 5.6L4 20v-6h6l-2.3 2.3A5.5 5.5 0 0 0 17.5 12Z" /></symbol>
        <symbol id="i-flag" viewBox="0 0 24 24"><rect x="4" y="2" width="2.6" height="20" rx="1.3" /><path d="M7 3h12l-3 4.5L19 12H7Z" /></symbol>
        <symbol id="i-arrows" viewBox="0 0 24 24"><path d="M2 12 8 6v4h8V6l6 6-6 6v-4H8v4Z" /></symbol>
        <symbol id="i-crack" viewBox="0 0 24 24"><path d="M3 14h18v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z" /><path d="M11 3 9 8l4 2-2 4h2.5l2-4.5-4-2L13 3Z" /></symbol>
        <symbol id="i-chest" viewBox="0 0 24 24"><path d="M3 10a6 6 0 0 1 6-6h6a6 6 0 0 1 6 6v1H3Z" /><rect x="3" y="12" width="18" height="9" rx="2" /><rect x="10" y="10" width="4" height="5" rx="1" fill="#1a0b2e" /></symbol>
      </defs>
    </svg>

    <div id="intro" class="intro">
      <div class="logo" aria-label="Magma Climb">
        <span class="logo-line logo-top" data-text="MAGMA">MAGMA</span>
        <span class="logo-line logo-bottom" data-text="CLIMB">CLIMB</span>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-left">
          <div class="gems pill"><svg class="ico gem-ico"><use href="#i-gem" /></svg><span id="gems">0</span></div>
          <div class="best pill">BEST <span id="best">0</span>m</div>
        </div>
        <div class="height">
          <span id="height" class="stroke-text" data-text="0">0</span><small>m</small>
        </div>
        <div class="hud-right">
          <button id="soundBtn" class="icon-btn" aria-label="Toggle sound"><svg class="ico"><use href="#i-sound" /></svg></button>
          <button id="pauseBtn" class="icon-btn" aria-label="Pause"><svg class="ico"><use href="#i-pause" /></svg></button>
        </div>
      </div>
      <div class="lava-meter">
        <div class="lava-meter-track">
          <div id="meterLava" class="lava-meter-fill"></div>
          <div id="meterPlayer" class="lava-meter-player"></div>
        </div>
      </div>
      <div id="zoneBanner" class="zone-banner hidden">
        <small id="zoneNum">ZONE 2</small>
        <b id="zoneName" class="stroke-text" data-text="Ember Cliffs">Ember Cliffs</b>
      </div>
      <div id="tutorial" class="tutorial hidden"></div>
      <div id="controlsStrip" class="controls-strip hidden"></div>
    </div>

    <div id="pause" class="screen hidden">
      <h2 class="screen-title stroke-text" data-text="PAUSED">PAUSED</h2>
      <div id="controlsCard" class="controls-card"></div>
      <button id="resumeBtn" class="btn-play"><span>RESUME</span></button>
    </div>

    <div id="results" class="screen results hidden">
      <div class="results-grid">
        <section class="results-main">
          <h2 class="dead-title stroke-text" data-text="MELTED!">MELTED!</h2>
          <div class="dead-stats">
            <div class="stat"><small>HEIGHT</small><b id="deadHeight">0m</b></div>
            <div class="stat"><small>GEMS</small><b id="deadGems">+0</b></div>
          </div>
          <div id="gemBreakdown" class="breakdown"></div>
          <div id="newBest" class="new-best hidden">NEW BEST!</div>
          <div class="results-actions">
            <button id="reviveBtn" class="btn-revive hidden"><svg class="ico"><use href="#i-heart" /></svg><span>SECOND CHANCE</span><b><svg class="ico gem-ico"><use href="#i-gem" /></svg><span id="reviveCost">30</span></b></button>
            <button id="retry" class="btn-play"><span>CLIMB AGAIN</span></button>
            <button id="doubleGems" class="btn-play btn-ad hidden"><svg class="ico"><use href="#i-video" /></svg><span>DOUBLE GEMS</span></button>
          </div>
          <p id="tip" class="tip"></p>
        </section>
        <section class="shop">
          <div class="shop-head">
            <div class="tabs">
              <button class="tab active" data-tab="upgrades">UPGRADES</button>
              <button class="tab" data-tab="skins">SKINS</button>
              <button class="tab" data-tab="missions">MISSIONS<i id="missionBadge" class="badge hidden"></i></button>
            </div>
            <div class="wallet pill"><svg class="ico gem-ico"><use href="#i-gem" /></svg><span id="wallet">0</span></div>
          </div>
          <div id="daily" class="daily hidden">
            <svg class="ico chest-ico"><use href="#i-chest" /></svg>
            <div class="daily-text"><b>Daily Chest</b><small id="dailyStreak">Day 1</small></div>
            <button id="dailyBtn" class="btn-small">CLAIM <svg class="ico gem-ico"><use href="#i-gem" /></svg><span id="dailyAmount">10</span></button>
          </div>
          <div id="shopUpgrades" class="shop-list"></div>
          <div id="shopSkins" class="shop-list skins hidden"></div>
          <div id="shopMissions" class="shop-list hidden"></div>
        </section>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <div id="adOverlay" class="ad-overlay hidden"><div class="spinner"></div></div>

    <div id="touch" class="hidden">
      <div id="stick" class="stick"><div id="stickKnob" class="stick-knob"></div></div>
      <button id="jumpBtn" class="jump-btn">JUMP</button>
    </div>

    <button id="tapStart" class="tap-start hidden" aria-label="Tap to play"><span>TAP TO PLAY</span></button>

  </body>
</html>
